    @media (max-width: 767px) {

    /* ---------- tema gelap ---------- */

    .dark :is(:is(body.tya-hal-pengaturan .fi-main, .fi-modal .fi-modal-content), .fi-modal .fi-modal-content) .fi-fo-field:not(#tya-x) .fi-input-wrp {
        background: #141417 !important;

    .dark :is(:is(body.tya-hal-pengaturan .fi-main, .fi-modal .fi-modal-content), .fi-modal .fi-modal-content) .fi-fo-field[data-tya-ikon]:not(#tya-x) .fi-input-wrp::before {
        background-color: #a1a1aa;

    .dark :is(:is(body.tya-hal-pengaturan .fi-main, .fi-modal .fi-modal-content), .fi-modal .fi-modal-content) .fi-fo-field[data-tya-ikon]:not(#tya-x) .fi-input-wrp:not(:has(.fi-input-wrp-prefix > .fi-icon)) > .fi-input-wrp-content-ctn,
    .dark :is(:is(body.tya-hal-pengaturan .fi-main, .fi-modal .fi-modal-content), .fi-modal .fi-modal-content) .fi-fo-field:not(#tya-x) .fi-input-wrp-prefix:not(.fi-input-wrp-prefix-has-label) {
        border-color: rgba(255, 255, 255, .1) !important;
    }

    .dark :is(:is(body.tya-hal-pengaturan .fi-main, .fi-modal .fi-modal-content), .fi-modal .fi-modal-content) .fi-fo-field:not(#tya-x) :is(.fi-fo-field-label, .fi-fo-field-wrp-label) {
        color: #d4d4d8 !important;
    }
</style>
<script>
    /* FORM-PRO: kenali halaman Pengaturan, pilih ikon isian dari label (halaman Pengaturan & semua popup), tombol Simpan rata kanan. */
    (function () {
        if (window.__tyaFormPro) return;
        window.__tyaFormPro = true;

        var IKON_FIELD = [
            [/password|kata sandi|sandi/, 'lock'],
            [/secret|token|rahasia|api key|kunci|\bkey\b/, 'key'],
            [/e-?mail/, 'mail'],
            [/nama isp|rt-?rw|perusahaan|nama usaha|brand/, 'building'],
            [/mitra|outlet|reseller|toko|agen/, 'store'],
            [/telegram|chat id|bot/, 'send'],
            [/whats ?app|kontak|no\.? ?hp|nomor hp|telepon|telp|phone|\bhp\b|\bwa\b/, 'phone'],
            [/alamat|lokasi|koordinat/, 'pin'],
            [/upload|unggah|\btx\b/, 'up'],
            [/download|unduh|\brx\b/, 'down'],
            [/zona|waktu|jam|interval|menit|detik|jadwal|durasi|masa/, 'clock'],
            [/vpn|tunnel/, 'shield'],
            [/router|gateway|\bnas\b|mikrotik|queue/, 'router'],
            [/domain|website|situs/, 'globe'],
            [/\bip\b|host|server|radius|range/, 'server'],
            [/url|link|webhook/, 'link'],
            [/komisi|persen|diskon|%/, 'percent'],
            [/harga|biaya|nominal|tarif|denda|saldo|modal|\brp\b|\bidr\b/, 'money'],
            [/tanggal|tgl|hari|bulan|tahun|jatuh tempo|periode/, 'calendar'],
            [/logo|foto|gambar|avatar|icon|ikon/, 'image'],
            [/backup|database|cadangan/, 'database'],
            [/tagihan|invoice/, 'receipt'],
            [/isolir|blokir|suspend/, 'ban'],
            [/ssid|wifi|hotspot/, 'wifi'],
            [/pesan|template|catatan|keterangan|deskripsi|teks|footer|header|judul/, 'message'],
            [/nama lengkap|nama pelanggan|nama pengguna|username|pengguna|pemilik|admin|penanggung/, 'user'],
            [/nama|label|paket|profil|group|grup|kode/, 'tag'],
            [/port|nomor|jumlah|batas|maks|min|limit|urutan|prefix|cidr|id\b/, 'hash']
        ];
        var IKON_SECTION = [
            [/perusahaan|isp|usaha/, 'building'],
            [/akun|profil/, 'user'],
            [/vpn|tunnel/, 'shield'],
            [/radius|server|mikrotik|nas/, 'server'],
            [/telegram|bot/, 'send'],
            [/whats ?app|notifikasi|pesan|template/, 'message'],
            [/tagihan|invoice|otomatis|pembayaran/, 'receipt'],
            [/router|\bnas\b|group|grup/, 'router'],
            [/backup|data|import|export|cadangan/, 'database'],
            [/isolir|blokir/, 'ban'],
            [/hak|akses|peran|role|izin|keamanan|password/, 'key'],
            [/user|pengguna/, 'user'],
            [/kecepatan|bandwidth|speed/, 'up'],
            [/mitra|outlet|reseller/, 'store'],
            [/informasi|dasar|data|umum|detail/, 'tag'],
            [/tampilan|logo|tema/, 'image'],
            [/jadwal|waktu/, 'clock']
        ];

        function cocok(daftar, teks, cadangan) {
            for (var i = 0; i < daftar.length; i++) {
                if (daftar[i][0].test(teks)) return daftar[i][1];
            }
            return cadangan;
        }

        function halamanPengaturan() {
            var aktif = document.querySelector('.fi-sidebar-item.fi-active, .fi-sidebar-item-active');
            var grup = aktif ? aktif.closest('.fi-sidebar-group') : null;
            var label = grup ? grup.querySelector('.fi-sidebar-group-label, .fi-sidebar-group-btn') : null;
            if (label && /pengaturan|setting/i.test(label.textContent || '')) return true;
            return /\/(settings?|pengaturan|profile|profil)(\/|$|-)/i.test(location.pathname);
        }

        function tandaiField(f) {
            if (f.hasAttribute('data-tya-ikon') || !f.querySelector('.fi-input-wrp')) return;
            var lab = f.querySelector('.fi-fo-field-label-content, .fi-fo-field-label');
            var t = ((lab && lab.textContent) || '').toLowerCase().trim();
            var cadangan = f.querySelector('textarea') ? 'text' : (f.querySelector('select, .fi-select-input') ? 'list' : 'pencil');
            f.setAttribute('data-tya-ikon', cocok(IKON_FIELD, t, cadangan));
        }

        function tandaiSection(h) {
            if (h.hasAttribute('data-tya-ikon')) return;
            var j = h.querySelector('.fi-section-header-heading');
            var t = ((j && j.textContent) || '').toLowerCase().trim();
            h.setAttribute('data-tya-ikon', cocok(IKON_SECTION, t, 'gear'));
        }

        function tombolSimpan() {
            document.querySelectorAll('.fi-main .fi-page-content button[type="submit"].fi-btn, .fi-main .fi-page-content .fi-form-actions .fi-btn.fi-color-primary').forEach(function (b) {
                if (b.closest('.fi-modal, .fi-ta, .fi-header')) return;
                b.classList.add('tya-btn-simpan');
                var p = b.closest('.fi-ac, .fi-form-actions, .fi-sc-actions') || b.parentElement;
                if (p && !p.querySelector('.fi-fo-field')) p.classList.add('tya-aksi-kanan');
            });
        }

        var dijadwalkan = false;
        function proses() {
            dijadwalkan = false;
            var ya = halamanPengaturan();
            document.body.classList.toggle('tya-hal-pengaturan', ya);

            document.querySelectorAll('.fi-modal .fi-modal-content .fi-fo-field').forEach(tandaiField);
            document.querySelectorAll('.fi-modal .fi-modal-content .fi-section > .fi-section-header').forEach(tandaiSection);
            if (!ya) return;
            document.querySelectorAll('.fi-main .fi-fo-field').forEach(tandaiField);
            document.querySelectorAll('.fi-main .fi-section > .fi-section-header').forEach(tandaiSection);
            tombolSimpan();
        }

        var tunda = null;
        function jadwalkan() {
            if (dijadwalkan) return;
            dijadwalkan = true;
            clearTimeout(tunda);
            tunda = setTimeout(function () { window.requestAnimationFrame(proses); }, 60);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', jadwalkan);
        } else {
            jadwalkan();
        }
        new MutationObserver(jadwalkan).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('livewire:navigated', jadwalkan);
    })();
</script>
