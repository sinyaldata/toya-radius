<style>
    /* =====================================================================
     * KARTU-TABEL-MOBILE (2026-10-12) -- semua tabel jadi KARTU di HP (< 768px).
     * Skrip di bawah menempelkan nama kolom ke tiap sel (data-tya-label) dan
     * menandai sel judul / aksi; CSS ini lalu menyusun tiap baris menjadi kartu:
     * nomor di kiri atas, judul tebal, data dalam kotak kecil berlabel, tombol
     * aksi berderet di bawah (ikon + nama). Layar >= 768px TIDAK berubah.
     * Tabel yang memakai fitur bawaan Filament stackedOnMobile() dilewati.
     * ===================================================================== */
    @media (max-width: 767px) {
        table.fi-ta-table.tya-kartu {
            display: block !important;
            width: 100% !important;
            min-width: 0 !important;
            border: 0 !important;
            background: transparent !important;
        }

        table.fi-ta-table.tya-kartu > thead {
            display: none !important;
        }

        table.fi-ta-table.tya-kartu > tbody {
            display: block !important;
            padding: 10px !important;
            border: 0 !important;
            background: transparent !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row {
            position: relative !important;
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 8px !important;
            margin: 0 0 10px !important;
            padding: 12px !important;
            background: #ffffff !important;
            border: 1px solid #ececef !important;
            border-radius: 14px !important;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06) !important;
            height: auto !important;
            min-height: 0 !important;
            max-height: none !important;
            grid-auto-rows: auto !important;
            align-items: start !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row:last-child {
            margin-bottom: 0 !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td {
            position: static !important;
            min-width: 0 !important;
            max-width: none !important;
            width: auto !important;
            padding: 0 !important;
            border: 0 !important;
            background: transparent !important;
            white-space: normal !important;
            text-align: start !important;
            left: auto !important;
            box-shadow: none !important;
            height: auto !important;
            min-height: 0 !important;
            max-height: none !important;
            overflow: visible !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td .fi-ta-col,
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td .fi-ta-text,
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td .fi-ta-text-item {
            padding: 0 !important;
            white-space: normal !important;
            max-width: none !important;
            overflow: visible !important;
        }

        /* Nomor urut di kiri atas kartu. */
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row[data-tya-no]::before {
            content: attr(data-tya-no);
            position: absolute;
            top: 12px;
            left: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #ffedd5;
            color: #9a3412;
            font-size: 15px;
            font-weight: 800;
        }

        /* Judul kartu (kolom pertama yang tampil). */
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-judul {
            grid-column: 1 / -1 !important;
            min-height: 40px !important;
            padding-left: 52px !important;
            display: flex !important;
            align-items: center !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row:has(> td.tya-pilih) > td.tya-judul {
            padding-right: 34px !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-judul,
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-judul .fi-ta-text-item,
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-judul .fi-ta-text-item * {
            font-size: 15px !important;
            font-weight: 700 !important;
            line-height: 1.25 !important;
            color: #18181b !important;
        }

        /* Kotak data berlabel. */
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-isi {
            padding: 8px 10px !important;
            background: #f6f6f7 !important;
            border-radius: 10px !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-isi[data-tya-label]::before {
            content: attr(data-tya-label);
            display: block;
            margin-bottom: 3px;
            font-size: 10px;
            font-weight: 500;
            line-height: 1.2;
            color: #71717a;
            text-transform: none;
            letter-spacing: 0;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-isi .fi-ta-text-item,
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-isi .fi-ta-text-item-label {
            font-size: 13px !important;
            font-weight: 600 !important;
            color: #27272a !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-lebar {
            grid-column: 1 / -1 !important;
        }

        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-no-asli {
            display: none !important;
        }

        /* Kotak centang pilih di kanan atas. */
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-pilih {
            position: absolute !important;
            top: 14px !important;
            right: 12px !important;
            left: auto !important;
            width: auto !important;
            z-index: 1 !important;
        }

        /* Tombol aksi: berderet sama lebar di bawah kartu, ikon + nama. */
        table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-aksi {
            grid-column: 1 / -1 !important;
            margin-top: 2px !important;
        }

        table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions {
            display: flex !important;
            flex-wrap: nowrap !important;
            justify-content: stretch !important;
            gap: 6px !important;
            width: 100% !important;
        }

        table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions > * {
            flex: 1 1 0 !important;
            min-width: 0 !important;
        }

        table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions .fi-dropdown,
        table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions .fi-dropdown-trigger {
            display: flex !important;
            width: 100% !important;
        }

        table.fi-ta-table.tya-kartu td.tya-aksi .fi-icon-btn,
        table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions .fi-btn,
        table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions .fi-link {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 3px !important;
            width: 100% !important;
            min-width: 0 !important;
            max-width: none !important;
            height: auto !important;
            min-height: 48px !important;
            max-height: none !important;
            margin: 0 !important;
            padding: 6px 4px !important;
            border: 0 !important;
            border-radius: 10px !important;
            background: #fff7ed !important;
            color: #ea580c !important;
            font-size: 10px !important;
            font-weight: 600 !important;
            line-height: 1.1 !important;
            box-shadow: none !important;
            text-decoration: none !important;
        }

        table.fi-ta-table.tya-kartu td.tya-aksi .fi-icon-btn .fi-icon,
        table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions .fi-btn .fi-icon,
        table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions .fi-link .fi-icon {
            width: 18px !important;
            height: 18px !important;
            color: inherit !important;
        }

        table.fi-ta-table.tya-kartu td.tya-aksi .fi-icon-btn[aria-label]::after {
            content: attr(aria-label);
            display: block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 10px;
            font-weight: 600;
        }

        table.fi-ta-table.tya-kartu td.tya-aksi .fi-color-danger,
        table.fi-ta-table.tya-kartu td.tya-aksi .fi-color-danger .fi-icon {
            background: #fef2f2 !important;
            color: #dc2626 !important;
        }

        table.fi-ta-table.tya-kartu td.tya-aksi .fi-color-danger .fi-icon {
            background: transparent !important;
        }

        /* Baris total (ringkasan) di bawah tabel. */
        table.fi-ta-table.tya-kartu > tfoot {
            display: block !important;
            padding: 0 10px 10px !important;
        }

        table.fi-ta-table.tya-kartu > tfoot > tr {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 6px !important;
        }

        table.fi-ta-table.tya-kartu > tfoot > tr > td:empty {
            display: none !important;
        }

        /* ---------- TEMA GELAP ---------- */
        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row {
            background: #18181b !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
            box-shadow: none !important;
        }

        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row[data-tya-no]::before {
            background: rgba(249, 115, 22, 0.16);
            color: #fdba74;
        }

        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-judul,
        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-judul .fi-ta-text-item,
        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-judul .fi-ta-text-item * {
            color: #fafafa !important;
        }

        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-isi {
            background: rgba(255, 255, 255, 0.05) !important;
        }

        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-isi[data-tya-label]::before {
            color: #a1a1aa;
        }

        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-isi .fi-ta-text-item,
        .dark table.fi-ta-table.tya-kartu > tbody > tr.fi-ta-row > td.tya-isi .fi-ta-text-item-label {
            color: #e4e4e7 !important;
        }

        .dark table.fi-ta-table.tya-kartu td.tya-aksi .fi-icon-btn,
        .dark table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions .fi-btn,
        .dark table.fi-ta-table.tya-kartu td.tya-aksi .fi-ta-actions .fi-link {
            background: rgba(249, 115, 22, 0.12) !important;
            color: #fb923c !important;
        }

        .dark table.fi-ta-table.tya-kartu td.tya-aksi .fi-color-danger {
            background: rgba(239, 68, 68, 0.12) !important;
            color: #f87171 !important;
        }

        .dark table.fi-ta-table.tya-kartu td.tya-aksi .fi-color-danger .fi-icon {
            color: #f87171 !important;
        }
    }
</style>
<script>
    /* KARTU-TABEL-MOBILE: tempelkan nama kolom ke tiap sel & tandai judul/aksi.
     * Hanya bekerja di layar < 768px; dijalankan ulang setiap Livewire selesai
     * memperbarui tabel (ganti halaman, cari, filter, sort). */
    (function () {
        if (window.__tyaKartuTabel) return;
        window.__tyaKartuTabel = true;

        var mq = window.matchMedia('(max-width: 767px)');
        var dijadwalkan = false;

        function teks(el) {
            return (el.textContent || '').replace(/\s+/g, ' ').trim();
        }

        function tersembunyi(el) {
            return window.getComputedStyle(el).display === 'none';
        }

        function proses() {
            dijadwalkan = false;
            if (!mq.matches) return;

            document.querySelectorAll('table.fi-ta-table').forEach(function (tabel) {
                if (tabel.classList.contains('fi-ta-table-stacked-on-mobile')) return;
                if (tabel.closest('.tya-tanpa-kartu')) return;

                var kepala = tabel.querySelector(':scope > thead > tr');
                if (!kepala) return;

                var label = [];
                Array.prototype.forEach.call(kepala.children, function (th) {
                    var lebar = parseInt(th.getAttribute('colspan') || '1', 10) || 1;
                    var isi = teks(th);
                    for (var i = 0; i < lebar; i++) label.push(isi);
                });

                tabel.classList.add('tya-kartu');
                var urut = 0;

                tabel.querySelectorAll(':scope > tbody > tr.fi-ta-row').forEach(function (tr) {
                    urut++;
                    var adaJudul = false;
                    var noAsli = null;
                    var sel = tr.children;

                    for (var i = 0; i < sel.length; i++) {
                        var td = sel[i];
                        if (td.tagName !== 'TD') continue;
                        var nama = label[i] || '';

                        td.classList.remove('tya-judul', 'tya-isi', 'tya-aksi', 'tya-pilih', 'tya-lebar', 'tya-no-asli');

                        if (td.classList.contains('fi-ta-selection-cell')) {
                            td.classList.add('tya-pilih');
                            continue;
                        }
                        if (td.querySelector('.fi-ta-actions')) {
                            td.classList.add('tya-aksi');
                            continue;
                        }
                        if (/^(#|no\.?|nomor)$/i.test(nama)) {
                            td.classList.add('tya-no-asli');
                            noAsli = teks(td) || null;
                            continue;
                        }
                        if (tersembunyi(td)) continue;

                        if (!adaJudul) {
                            td.classList.add('tya-judul');
                            adaJudul = true;
                            continue;
                        }

                        td.classList.add('tya-isi');
                        if (nama) {
                            if (td.getAttribute('data-tya-label') !== nama) td.setAttribute('data-tya-label', nama);
                        } else {
                            td.removeAttribute('data-tya-label');
                        }
                        if (teks(td).length > 22) td.classList.add('tya-lebar');
                    }

                    var no = noAsli || String(urut);
                    if (tr.getAttribute('data-tya-no') !== no) tr.setAttribute('data-tya-no', no);
                });
            });
        }

        function jadwalkan() {
            if (dijadwalkan) return;
            dijadwalkan = true;
            window.requestAnimationFrame(proses);
        }

        function mulai() {
            jadwalkan();
            new MutationObserver(jadwalkan).observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mulai);
        } else {
            mulai();
        }

        if (mq.addEventListener) mq.addEventListener('change', jadwalkan);
        document.addEventListener('livewire:navigated', jadwalkan);
        function pasangHookLivewire() {
            if (window.__tyaKartuHook || !window.Livewire || !window.Livewire.hook) return;
            window.__tyaKartuHook = true;
            window.Livewire.hook('commit', function (c) {
                if (c && c.succeed) c.succeed(function () { setTimeout(jadwalkan, 30); });
            });
        }

        pasangHookLivewire();
        document.addEventListener('livewire:init', pasangHookLivewire);
    })();
</script>
