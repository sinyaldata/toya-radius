            width: 100% !important;
            max-width: 100% !important;

            justify-content: center;

            height: 7px;

        }

        }

            height: 46px;

            justify-content: center;
            border-radius: 14px;

            height: 22px !important;

            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 6px;
            height: 6px;
            border-radius: 9999px;
            background: #f97316;
        }

        #tya-menu-utama .tya-menu-label,
        #tya-lembar .tya-menu-label {
            width: 100%;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.2;
            text-align: center;
            color: #3f3f46;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        #tya-menu-utama .tya-aktif .tya-menu-ikon,
        #tya-lembar .tya-aktif .tya-menu-ikon {
            background: #f97316;
            color: #ffffff;
        }

        #tya-menu-utama .tya-menu-grup.tya-aktif .tya-menu-ikon::after {

        }

        #tya-lembar.tya-buka {
            display: block;
            position: fixed;
            inset: 0;
            z-index: 60;
        }

        #tya-lembar .tya-lembar-latar {
            position: absolute;
            inset: 0;
            background: rgba(9, 9, 11, 0.5);
        }

        #tya-lembar .tya-lembar-isi {

            left: 0;
            right: 0;
            bottom: 0;
            max-height: 75dvh;
            overflow-y: auto;
            padding: 10px 12px calc(16px + env(safe-area-inset-bottom, 0px));
            background: #ffffff;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.18);
            animation: tya-naik 0.2s ease-out;
        }

        #tya-lembar .tya-lembar-pegangan {
            width: 40px;
            height: 4px;
            margin: 0 auto 12px;
            border-radius: 9999px;
            background: #d4d4d8;

            to { transform: translateY(0); opacity: 1; }

        }

        .dark #tya-menu-utama .tya-menu-label,

            color: #d4d4d8;
        }

            mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M19.5%2014.25v-2.63A3.38%203.38%200%200%200%2016.13%208.25h-1.5A1.13%201.13%200%200%201%2013.5%207.13v-1.5A3.38%203.38%200%200%200%2010.13%202.25H8.25m0%2012.75h7.5m-7.5%203H12M10.5%202.25H5.63c-.62%200-1.13.5-1.13%201.13v17.25c0%20.62.5%201.13%201.13%201.13h12.75c.62%200%201.13-.5%201.13-1.13V11.25a9%209%200%200%200-9-9z%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
        }

            font-size: 10px;

        }

        .dark #tya-mtop .tya-mtop-invoice .tya-lencana {
            box-shadow: 0 0 0 2px #18181b;
        }
    }

<script>
    /* DASBOR-MOBILE-V2 */
    (function () {

        var terbuka = {};            // label kartu -> true bila nominal ditampilkan
        var asliTeks = new WeakMap(); // text node -> teks asli
        var IKON_BAWAAN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6zm0 9.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25zM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6zm0 9.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25z"/></svg>';

        function teks(el) {
            return (el && el.textContent || '').replace(/\s+/g, ' ').trim();

        function esc(s) {
            return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
        }

        // ---------------- slide kartu ----------------
        function slide() {
            var wadah = document.querySelector('.tya-statistik');
            if (!wadah) return null;
            wadah.classList.add('tya-slide');
            var kartu = Array.prototype.filter.call(wadah.children, function (c) {

            nodeUang(kartu).forEach(function (n) {

                if (k) terapkanUang(k, label);

                label: teks(li.querySelector(':scope > .fi-sidebar-item-btn .fi-sidebar-item-label')) || teks(a),
                ikon: ikon ? ikon.outerHTML : (ikonCadangan || IKON_BAWAAN),
                aktif: li.classList.contains('fi-active') || li.classList.contains('fi-sidebar-item-has-active-child-items'),
                anak: Array.prototype.map.call(li.querySelectorAll(':scope > .fi-sidebar-sub-group-items > li.fi-sidebar-item'), function (c) { return infoItem(c, ikon ? ikon.outerHTML : ikonCadangan); }).filter(Boolean),
            };
        }

        function daftarUtama() {
            var hasil = [];
            document.querySelectorAll('.fi-sidebar-nav .fi-sidebar-group').forEach(function (g) {
                var btn = g.querySelector(':scope > .fi-sidebar-group-btn');
                var gi = btn ? btn.querySelector(':scope > svg') : null;
                var items = Array.prototype.map.call(g.querySelectorAll(':scope > .fi-sidebar-group-items > li.fi-sidebar-item'), function (li) {
                    return infoItem(li, gi ? gi.outerHTML : null);
                }).filter(Boolean);
                if (!items.length) return;

                var label = btn ? teks(btn.querySelector('.fi-sidebar-group-label')) : '';
                if (label) {
                    var ikonGrup = gi ? gi.outerHTML : (items[0].ikon || IKON_BAWAAN);
                    hasil.push({ grup: true, label: label, ikon: ikonGrup, anak: items, aktif: items.some(function (i) { return i.aktif; }) });
                } else {
                    items.forEach(function (i) { hasil.push(i); });
                }
            });
            // item di luar grup (versi lama Filament)
            document.querySelectorAll('.fi-sidebar-nav > ul > li.fi-sidebar-item, .fi-sidebar-nav-groups > li.fi-sidebar-item').forEach(function (li) {
                var i = infoItem(li, null);
                if (i) hasil.push(i);
            });
            return hasil;
        }

        var menuTerakhir = [];

        function bukaLembar(m) {
            var l = document.getElementById('tya-lembar');
            if (!l) {
                l = document.createElement('div');
                l.id = 'tya-lembar';
                document.body.appendChild(l);
            }
            var html = '<div class="tya-lembar-latar"></div><div class="tya-lembar-isi" role="dialog" aria-label="' + esc(m.label) + '"><div class="tya-lembar-pegangan"></div><div class="tya-lembar-judul">' + esc(m.label) + '</div><div class="tya-menu-grid">';
            var daftar = m.grup ? m.anak : [{ href: m.href, label: m.label, ikon: m.ikon, aktif: m.aktif }].concat(m.anak);
            daftar.forEach(function (s) {
                html += '<a class="tya-menu-item ' + (s.aktif ? 'tya-aktif' : '') + '" href="' + esc(s.href) + '"><span class="tya-menu-ikon">' + s.ikon + '</span><span class="tya-menu-label">' + esc(s.label) + '</span></a>';
            });
            l.innerHTML = html + '</div></div>';
            l.querySelector('.tya-lembar-latar').addEventListener('click', tutupLembar);
            l.classList.add('tya-buka');
        }

        function tutupLembar() {
            var l = document.getElementById('tya-lembar');
            if (l) l.classList.remove('tya-buka');
        }

        function menuUtama() {
            var lama = document.getElementById('tya-menu-ikon');
            if (!lama) return;
            lama.classList.add('tya-diganti');

            var menu = daftarUtama();
            if (!menu.length) return;
            menuTerakhir = menu;

            var box = document.getElementById('tya-menu-utama');
            var kunci = JSON.stringify(menu.map(function (m) { return [m.label, m.href || '', m.aktif, (m.anak || []).length]; }));
            if (!box) {
                box = document.createElement('div');
                box.id = 'tya-menu-utama';
                box.addEventListener('click', function (e) {
                    var t = e.target.closest('[data-tya-grup]');
                    if (!t) return;
                    e.preventDefault();
                    var m = menuTerakhir[parseInt(t.getAttribute('data-tya-grup'), 10)];
                    if (m) bukaLembar(m);
                });
            }
            if (box.getAttribute('data-kunci') !== kunci) {
                box.setAttribute('data-kunci', kunci);
                var html = '<div class="tya-menu-judul">Menu</div><div class="tya-menu-grid">';
                menu.forEach(function (m, i) {
                    var punyaSub = m.grup || (m.anak && m.anak.length);
                    var kelas = 'tya-menu-item ' + (punyaSub ? 'tya-menu-grup ' : '') + (m.aktif ? 'tya-aktif' : '');
                    var isi = '<span class="tya-menu-ikon">' + m.ikon + '</span><span class="tya-menu-label">' + esc(m.label) + '</span>';
                    html += punyaSub
                        ? '<button type="button" class="' + kelas + '" data-tya-grup="' + i + '">' + isi + '</button>'
                        : '<a class="' + kelas + '" href="' + esc(m.href) + '">' + isi + '</a>';
                });
                box.innerHTML = html + '</div>';
            }
            if (lama.nextElementSibling !== box) lama.after(box);
        }

        // ---------------- ikon invoice di bar atas ----------------
        function linkInvoice() {
            var cocok = null;
            document.querySelectorAll('.fi-sidebar-nav li.fi-sidebar-item').forEach(function (li) {
                if (cocok) return;
                var a = li.querySelector(':scope > .fi-sidebar-item-btn');
                if (!a) return;
                var lbl = teks(a).toLowerCase();
                var href = (a.getAttribute('href') || '').toLowerCase();
                if (/belum\s*(di)?bayar|belum\s*lunas|tunggak|unpaid/.test(lbl) || /unpaid|belum-bayar|belum-lunas/.test(href)) {
                    var badge = li.querySelector('.fi-sidebar-item-badge-ctn, .fi-badge');
                    cocok = { href: a.getAttribute('href'), label: teks(li.querySelector('.fi-sidebar-item-label')) || 'Invoice belum dibayar', jumlah: badge ? teks(badge) : '' };
                }
            });
            return cocok;
        }

        function jumlahDariKartu() {
            var w = document.querySelector('.tya-statistik');
            if (!w) return '';
            var k = kartuDenganLabel(w, 'Invoice Belum Dibayar');
            var m = k ? teks(k).match(/(\d[\d.]*)\s*tagihan/i) : null;
            return m ? m[1] : '';
        }

        function ikonInvoice() {
            var bar = document.getElementById('tya-mtop');
            if (!bar) return;
            var info = linkInvoice();
            var a = bar.querySelector('.tya-mtop-invoice');
            if (!info) { if (a) a.remove(); return; }
            if (!a) {
                a = document.createElement('a');
                a.className = 'tya-mtop-invoice';
                bar.insertBefore(a, bar.querySelector('.tya-mtop-keluar'));
            }
            a.href = info.href;
            a.setAttribute('aria-label', info.label);
            a.setAttribute('title', info.label);
            var jml = info.jumlah || jumlahDariKartu();
            try {
                if (jml) sessionStorage.setItem('tya-jml-invoice', jml); else jml = sessionStorage.getItem('tya-jml-invoice') || '';
            } catch (e) {}
            var l = a.querySelector('.tya-lencana');
            if (jml && jml !== '0') {
                if (!l) { l = document.createElement('span'); l.className = 'tya-lencana'; a.appendChild(l); }
                var tampil = parseInt(String(jml).replace(/\D/g, ''), 10) > 99 ? '99+' : jml;
                if (l.textContent !== tampil) l.textContent = tampil;
            } else if (l) {
                l.remove();
            }
        }

        function proses() {
            dijadwalkan = false;
            if (!mq.matches) {
                document.querySelectorAll('.tya-slide').forEach(function (x) { x.classList.remove('tya-slide'); });
                ['tya-titik', 'tya-menu-utama', 'tya-lembar'].forEach(function (id) { var e = document.getElementById(id); if (e) e.remove(); });
                // kembalikan nominal asli
                LABEL_UANG.forEach(function (l) { terbuka[l] = true; });
                var w0 = document.querySelector('.tya-statistik');
                if (w0) uang(w0);
                document.querySelectorAll('.tya-mata').forEach(function (m) { m.remove(); });
                LABEL_UANG.forEach(function (l) { terbuka[l] = false; });
                return;
            }
            var w = slide();
            if (w) uang(w);
            menuUtama();
            ikonInvoice();
        }

        function jadwalkan() {
            if (dijadwalkan) return;
            dijadwalkan = true;
            // dua frame: setelah skrip dasbor versi 1 menyusun kartu & menu
            window.requestAnimationFrame(function () { window.requestAnimationFrame(proses); });
        }

        function mulai() {
            jadwalkan();
            new MutationObserver(function (daftar) {
                for (var i = 0; i < daftar.length; i++) {
                    var t = daftar[i].target;
                    if (t && t.nodeType === 3) t = t.parentElement;
                    if (t && t.closest && t.closest('#tya-menu-utama, #tya-lembar, #tya-titik, .tya-mata')) continue;
                    jadwalkan();
                    return;
                }
            }).observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
        else mulai();

        if (mq.addEventListener) mq.addEventListener('change', jadwalkan);
        document.addEventListener('livewire:navigated', jadwalkan);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') tutupLembar(); });
    })();
</script>
