<style>
    /* =====================================================================
     * DASBOR-MOBILE-V4 (2026-10-13) -- HP (< 768px):
     *  - kartu ringkasan lebih pendek (176px -> 140px), judul tidak terpotong
     *  - sapaan di bar atas cukup nama depan (lihat skrip di bawah)

    @media (max-width: 767px) {

            height: 140px !important;

        .tya-k .tya-k-ikon {

        .tya-k .tya-k-chip {
            top: 21px !important;

            font-size: 12px !important;
        }

        .tya-k .tya-k-chip svg {
            width: 12px !important;

        .tya-k .tya-k-titik {
            top: 28px !important;

        .tya-k .tya-k-nilai {
            top: 64px !important;

        }

        .tya-k .tya-k-nilai .tya-mata {
            width: 30px;
            height: 30px;
            margin-inline-start: 6px;
        }

        .tya-k .tya-k-nilai .tya-mata::before,
        .tya-k .tya-k-nilai .tya-mata.tya-terbuka::before {

        #tya-mtop .tya-mtop-nama {
            display: none !important;

        #tya-mtop .tya-mtop-depan {
            font-size: 15px;
            font-weight: 700;
            color: #18181b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dark #tya-mtop .tya-mtop-depan {
            color: #fafafa;
        }

        .tya-k .tya-k-spark {

        }
    }
</style>
<script>
    /* DASBOR-MOBILE-V4: sapaan bar atas cukup nama depan. */
    (function () {
        if (window.__tyaDasborV4) return;
        window.__tyaDasborV4 = true;

        function namaDepan() {
            var asli = document.querySelector('#tya-mtop .tya-mtop-nama');
            if (!asli) return;
            var depan = asli.parentElement.querySelector('.tya-mtop-depan');
            if (!depan) {
                depan = document.createElement('div');
                depan.className = 'tya-mtop-depan';
                asli.after(depan);
            }
            var penuh = (asli.textContent || '').trim();
            var pertama = penuh.split(/\s+/)[0] || penuh;
            if (depan.textContent !== pertama) depan.textContent = pertama;
            if (depan.getAttribute('title') !== penuh) depan.setAttribute('title', penuh);
        }

        var dijadwalkan = false;
        function jadwalkan() {
            if (dijadwalkan) return;
            dijadwalkan = true;
            window.requestAnimationFrame(function () { window.requestAnimationFrame(function () { dijadwalkan = false; namaDepan(); }); });
        }

        function mulai() {
            jadwalkan();
            new MutationObserver(function (d) {
                for (var i = 0; i < d.length; i++) {
                    var t = d[i].target;
                    if (t && t.nodeType === 3) t = t.parentElement;
                    if (t && t.closest && t.closest('#tya-mtop')) { jadwalkan(); return; }
                }
            }).observe(document.body, { childList: true, subtree: true, characterData: true });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
        else mulai();
        document.addEventListener('livewire:navigated', jadwalkan);
    })();
</script>
