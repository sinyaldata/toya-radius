; /etc/supervisor/conf.d/toya-radius-worker.conf
[program:toya-radius-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/toya-radius/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/toya-radius/storage/logs/worker.log
stopwaitsecs=3600

; Setelah menambahkan file ini:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl start toya-radius-worker:*
