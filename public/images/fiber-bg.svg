<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0a0a0b"/>
            <stop offset="55%" stop-color="#18181b"/>
            <stop offset="100%" stop-color="#0a0a0b"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f97316" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
        </radialGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>

    <rect width="1600" height="1000" fill="url(#bg)"/>

    <!-- Untaian serat optik (kurva melengkung dengan cahaya berjalan) -->
    <g fill="none" stroke-linecap="round" opacity="0.55">
        <path d="M-50 780 C 300 700, 500 850, 820 650 S 1300 500, 1700 560" stroke="#f97316" stroke-width="1.5"/>
        <path d="M-50 850 C 350 900, 600 720, 900 780 S 1350 650, 1700 700" stroke="#fb923c" stroke-width="1"/>
        <path d="M-50 200 C 300 120, 550 260, 850 160 S 1350 40, 1700 120" stroke="#f97316" stroke-width="1"/>
        <path d="M-50 100 C 320 220, 580 60, 880 180 S 1320 260, 1700 200" stroke="#7c7c85" stroke-width="0.75"/>
        <path d="M-50 500 C 400 420, 650 560, 950 470 S 1400 380, 1700 440" stroke="#52525b" stroke-width="0.75"/>
    </g>

    <!-- Titik-titik cahaya (data pulse) di sepanjang serat -->
    <g fill="#fdba74">
        <circle cx="220" cy="735" r="3.2"/>
        <circle cx="560" cy="770" r="2.2"/>
        <circle cx="980" cy="600" r="3"/>
        <circle cx="1340" cy="530" r="2"/>
        <circle cx="150" cy="150" r="2.4"/>
        <circle cx="640" cy="200" r="3"/>
        <circle cx="1120" cy="90" r="2"/>
        <circle cx="1480" cy="150" r="2.6"/>
        <circle cx="400" cy="470" r="2"/>
        <circle cx="1080" cy="430" r="2.6"/>
    </g>

    <!-- Cahaya lembut menyebar di beberapa titik simpul -->
    <circle cx="820" cy="650" r="140" fill="url(#glow)" opacity="0.25"/>
    <circle cx="1300" cy="500" r="120" fill="url(#glow)" opacity="0.18"/>
    <circle cx="550" cy="260" r="110" fill="url(#glow)" opacity="0.15"/>

    <!-- Titik jaringan kecil tersebar (efek node/koneksi) -->
    <g fill="#3f3f46" opacity="0.6">
        <circle cx="120" cy="330" r="1.5"/>
        <circle cx="1500" cy="380" r="1.5"/>
        <circle cx="900" cy="900" r="1.5"/>
        <circle cx="300" cy="900" r="1.5"/>
        <circle cx="1450" cy="850" r="1.5"/>
        <circle cx="60" cy="600" r="1.5"/>
    </g>
</svg>
