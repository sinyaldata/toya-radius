<style>
    /* =====================================================================
     * WIZARD-PRO-V4 (2026-10-17) -- pengganti versi sebelumnya (dicabut installer). Semua form bertahap (wizard), di popup
     * maupun halaman, mengikuti referensi "Tambah Outlet":
     *  - langkah: garis kemajuan dengan titik; bagian yang sudah dilewati
     *    oranye, titik aktif oranye berpendar, label kecil di bawah titik
     *  - isi langkah dalam kartu dengan kotak ikon + judul + keterangan
     *  - tombol bundar "<" (Kembali) dan ">" (Selanjutnya). Di popup keduanya
     *    di pojok KANAN bawah; Batal & Simpan di KIRI bawah, sejajar
     *  - saklar "Aktif" pindah ke pojok kanan atas kartu, sejajar judul
     *    kartu (berlaku di semua form yang punya saklar Aktif)
     *  - Batal ikon panah putar balik, Simpan ikon disket (bukan silang/centang)
     *  - tombol Simpan di halaman Pengaturan diberi jarak dari isian
     * Terang & gelap.
     * ===================================================================== */

    /* ---------- jarak tombol Simpan halaman Pengaturan ---------- */

        margin-top: 1.5rem !important;
        padding-top: .25rem !important;
    }

    /* ---------- kepala wizard: garis kemajuan + titik ---------- */
    .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-header {
        display: flex !important;
        align-items: flex-start !important;
        gap: 0 !important;
        margin: 0 0 1rem !important;
        padding: .6rem 0 1rem !important;
        border: 0 !important;
        border-bottom: 1px solid #f0f0f2 !important;
        border-radius: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        overflow: visible !important;
        list-style: none !important;
    }

    .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-header > .fi-sc-wizard-header-step,
    .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-header > .fi-sc-wizard-header-step:last-child {
        display: flex !important;
        justify-content: center !important;
        flex: 1 1 0 !important;
        min-width: 0 !important;
        position: relative !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        border: 0 !important;
    }

    /* garis antar titik (abu), bagian yang sudah dilewati oranye */

        content: "" !important;
        display: block !important;
        position: absolute !important;
        top: 6px !important;
        left: 50% !important;
        right: -50% !important;
        height: 3px !important;
        margin: 0 !important;
        border-radius: 3px !important;
        background: #e4e4e7 !important;
        z-index: 0 !important;
    }

    .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-header > .fi-sc-wizard-header-step.fi-completed:not(:last-child)::after {
        background: #f97316 !important;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-separator {
        display: none !important;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-btn {
        position: relative !important;
        z-index: 1 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: .55rem !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;
        cursor: pointer;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-icon-ctn {
        box-sizing: border-box !important;
        width: 15px !important;
        height: 15px !important;
        min-width: 15px !important;
        border: 2.5px solid #3f3f46 !important;
        border-radius: 9999px !important;
        background: #ffffff !important;
        box-shadow: none !important;
        transition: box-shadow .2s ease, background .2s ease, border-color .2s ease;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-icon-ctn > * {
        display: none !important;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step.fi-active .fi-sc-wizard-header-step-icon-ctn {
        border-color: #f97316 !important;
        background: #f97316 !important;
        box-shadow: 0 0 0 5px rgba(249, 115, 22, .2) !important;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step.fi-completed .fi-sc-wizard-header-step-icon-ctn {
        border-color: #f97316 !important;
        background: #f97316 !important;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-text {
        display: block !important;
        justify-items: center !important;
        align-self: stretch !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        text-align: center !important;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-label {
        display: block !important;
        width: 100% !important;
        font-size: 11.5px !important;
        font-weight: 500 !important;
        line-height: 1.25 !important;
        color: #52525b !important;
        text-align: center !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step.fi-active .fi-sc-wizard-header-step-label {
        color: #ea580c !important;
        font-weight: 700 !important;
    }

    .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-description {
        display: none !important;
    }

    /* ---------- isi langkah ---------- */
    .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-step.fi-active {
        margin-top: 0 !important;
        padding: 0 !important;
    }

    /* langkah tanpa section sendiri -> dibungkus kartu */
    .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-step.fi-active:not(:has(.fi-section)) {
        padding: 1.1rem 1.25rem 1.25rem !important;
        border: 1px solid #ececef !important;
        border-radius: 14px !important;
        background: #ffffff !important;
    }

    /* judul kartu langkah (dibuat skrip dari nama langkah) */
    .tya-wiz-judul {
        display: flex;
        align-items: flex-start;
        gap: .8rem;
        margin: 0 0 1.1rem;
    }

    .tya-wiz-judul > i {
        position: relative;
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: #fff7ed;
        box-shadow: inset 0 0 0 1px rgba(249, 115, 22, .12);
    }

    .tya-wiz-judul > i::after {
        content: "";
        position: absolute;
        inset: 10px;
        background-color: #ea580c;
        -webkit-mask: var(--tya-ikon, var(--tya-i-tag)) center / contain no-repeat;
        mask: var(--tya-ikon, var(--tya-i-tag)) center / contain no-repeat;
    }

    .tya-wiz-judul b {
        display: block;
        font-size: 15px;
        font-weight: 800;
        color: #18181b;
        line-height: 1.3;
    }

    .tya-wiz-judul small {
        display: block;
        margin-top: .15rem;
        font-size: 12px;
        color: #71717a;
        line-height: 1.45;
    }

    /* ---------- tombol wizard: bundar tanpa tulisan ---------- */
    .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-footer {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        flex-wrap: nowrap !important;
        gap: .75rem !important;
        margin-top: 1.1rem !important;
        padding: .9rem 0 .15rem !important;
        border-top: 1px solid #f0f0f2 !important;
    }

    /* tombol maju selalu di kanan walau tombol kembali tersembunyi */
    .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-footer > :has(.tya-wiz-maju) {
        margin-inline-start: auto !important;
    }

    .fi-modal .fi-modal-footer .fi-btn {
        border-radius: 11px !important;
        min-height: 2.6rem !important;
        padding-inline: 1.15rem !important;
        font-weight: 700 !important;
        gap: .5rem !important;
    }

    .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y),
    .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y) {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex: 0 0 auto !important;
        padding: 0 !important;
        gap: 0 !important;
        border-radius: 9999px !important;
        font-size: 0 !important;
        line-height: 0 !important;
        width: auto !important;
    }

    .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y) .fi-btn-label,
    .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y) .fi-btn-label,
    .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y) > :is(svg, .fi-icon):not(.fi-loading-indicator),
    .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y) > :is(svg, .fi-icon):not(.fi-loading-indicator) {
        display: none !important;
    }

    .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y) {
        width: 46px !important;
        min-width: 46px !important;
        height: 46px !important;
        min-height: 46px !important;
        background: linear-gradient(135deg, #fb923c, #ea580c) !important;
        border: 0 !important;
        color: #ffffff !important;
        box-shadow: 0 8px 20px rgba(249, 115, 22, .35) !important;
    }

    .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y):hover {
        background: linear-gradient(135deg, #f97316, #c2410c) !important;
    }

    .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y) {
        width: 46px !important;
        min-width: 46px !important;
        height: 46px !important;
        min-height: 46px !important;
        background: #ffffff !important;
        color: #27272a !important;
        border: 1.5px solid #e4e4e7 !important;
        box-shadow: 0 2px 6px rgba(0, 0, 0, .05) !important;
    }

    .fi-modal .fi-modal-footer .tya-btn-batal:not(#tya-y) {
        background: #ffffff !important;
        color: #27272a !important;
        border: 1px solid #e4e4e7 !important;
        box-shadow: none !important;
    }

    .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y)::after,
    .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y)::before,
    .fi-modal .fi-modal-footer .tya-btn-batal:not(#tya-y)::before {
        content: "";
        flex: 0 0 auto;
        width: 17px;
        height: 17px;
        background-color: currentColor;
        -webkit-mask: var(--tya-panah) center / contain no-repeat;
        mask: var(--tya-panah) center / contain no-repeat;
    }

    .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y)::after {
        width: 20px;
        height: 20px;
    }

    .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y)::before {
        width: 20px;
        height: 20px;
    }

    /* » (panah ganda) */
    .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y) {
        --tya-panah: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M9%206l6%206-6%206%22%2F%3E%3C%2Fsvg%3E");
    }

    /* < */
    .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y) {
        --tya-panah: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222.3%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M15%206l-6%206%206%206%22%2F%3E%3C%2Fsvg%3E");
    }

    .fi-modal .fi-modal-footer .tya-btn-batal:not(#tya-y) .fi-btn-label {
        color: inherit !important;
        display: inline !important;
    }

    /* Batal selalu di kiri tombol utama */
    .fi-modal .fi-modal-footer .fi-modal-footer-actions:has(.tya-btn-batal) {
        display: flex !important;
        flex-direction: row !important;
        justify-content: flex-end !important;
        gap: .6rem !important;
    }

    .fi-modal .fi-modal-footer .fi-modal-footer-actions > :has(> .tya-btn-batal),
    .fi-modal .fi-modal-footer .tya-btn-batal:not(#tya-y) {
        order: -1 !important;
    }

    .fi-modal .fi-modal-footer .tya-btn-batal:not(#tya-y) {
        --tya-panah: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M9%2014L4%209l5-5M4%209h10.5a5.5%205.5%200%200%201%200%2011H11%22%2F%3E%3C%2Fsvg%3E");
        display: inline-flex !important;
        align-items: center !important;
    }

    .fi-modal .fi-modal-footer .tya-btn-batal:not(#tya-y) > :is(svg, .fi-icon):not(.fi-loading-indicator),
    .fi-modal .fi-modal-footer .tya-btn-simpan2:not(#tya-y) > :is(svg, .fi-icon):not(.fi-loading-indicator) {
        display: none !important;
    }

    /* Simpan: ikon disket */
    .fi-modal .fi-modal-footer .tya-btn-simpan2:not(#tya-y) {
        display: inline-flex !important;
        align-items: center !important;
        gap: .5rem !important;
    }

    .fi-modal .fi-modal-footer .tya-btn-simpan2:not(#tya-y)::before {
        content: "";
        flex: 0 0 auto;
        width: 17px;
        height: 17px;
        background-color: currentColor;
        -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%203.5h11l3.5%203.5v12a1.5%201.5%200%200%201-1.5%201.5H6a1.5%201.5%200%200%201-1.5-1.5V5A1.5%201.5%200%200%201%206%203.5z%22%2F%3E%3Cpath%20d%3D%22M8%203.5v5h7v-5M8%2020.5v-6h8v6%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
        mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%203.5h11l3.5%203.5v12a1.5%201.5%200%200%201-1.5%201.5H6a1.5%201.5%200%200%201-1.5-1.5V5A1.5%201.5%200%200%201%206%203.5z%22%2F%3E%3Cpath%20d%3D%22M8%203.5v5h7v-5M8%2020.5v-6h8v6%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
    }

    /* ---------- wizard di POPUP: tombol < > di pojok kiri bawah ----------
     * Tombolnya tidak dipindah (aman untuk Livewire), hanya diposisikan di
     * atas area kaki popup, sejajar Batal & Simpan. Jarak bawah dihitung skrip
     * (--tya-kaki) dari tinggi kaki popup. */
    .fi-modal-window.tya-wiz-popup:not(#tya-x) {
        position: relative !important;
    }

    .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-modal-content,
    .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-modal-content .fi-sc,
    .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-modal-content .fi-grid-col,
    .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-sc-wizard {
        position: static !important;
    }

    .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-sc-wizard > .fi-sc-wizard-footer {
        position: absolute !important;
        left: auto !important;
        right: 1.25rem !important;
        bottom: var(--tya-kaki, 14px) !important;
        z-index: 5 !important;
        width: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        gap: .55rem !important;
        justify-content: flex-start !important;
    }

    .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-sc-wizard > .fi-sc-wizard-footer > :has(.tya-wiz-maju) {
        margin-inline-start: 0 !important;
    }

    .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-modal-footer {
        padding-inline-end: calc(1.25rem + 46px * 2 + .55rem + 1rem) !important;
    }

    .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-modal-footer .fi-modal-footer-actions {
        width: 100% !important;
        justify-content: flex-start !important;
    }

    /* ---------- saklar "Aktif" di pojok kanan atas kartu ---------- */
    .tya-kartu-aktif:not(#tya-x) {
        position: relative !important;
    }

    .tya-kartu-aktif:not(#tya-x) .fi-sc,
    .tya-kartu-aktif:not(#tya-x) .fi-grid-col,
    .tya-kartu-aktif:not(#tya-x) .fi-section-content-ctn,
    .tya-kartu-aktif:not(#tya-x) .fi-section-content {
        position: static !important;
    }

    .tya-aktif-pojok:not(#tya-x) {
        position: absolute !important;
        top: var(--tya-aktif-atas, 1.2rem) !important;
        right: 1.25rem !important;
        left: auto !important;
        z-index: 3 !important;
        width: max-content !important;
        max-width: 55% !important;
        display: flex !important;
        justify-content: flex-end !important;
        align-items: center !important;
        gap: .5rem !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .tya-aktif-pojok:not(#tya-x) > *,
    .tya-aktif-pojok:not(#tya-x) .fi-fo-field-label-col {
        width: auto !important;
        min-width: 0 !important;
    }

    .tya-aktif-pojok:not(#tya-x) .fi-fo-field-label-ctn {
        justify-content: flex-end !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: .55rem !important;
    }

    /* kolom grid yang ditinggalkan saklar tidak menyisakan baris kosong */
    .fi-grid-col.tya-aktif-kolom:not(#tya-x) {
        display: contents !important;
    }

    /* judul kartu jangan tertimpa saklar */
    .tya-kartu-aktif:not(#tya-x) > .fi-section-header,
    .tya-kartu-aktif:not(#tya-x) > .tya-wiz-judul {
        padding-inline-end: 7.5rem !important;
    }

    /* ---------- HP ---------- */
    @media (max-width: 767px) {
        .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-header {
            padding: .5rem 0 .85rem !important;
        }

        .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-label {
            font-size: 10px !important;
            white-space: normal !important;
            overflow: visible !important;
        }

        .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-step.fi-active:not(:has(.fi-section)) {
            padding: .95rem 1rem 1.05rem !important;
        }

        .fi-sc-wizard:not(#tya-x) .tya-wiz-maju:not(#tya-y) {
            width: 44px !important;
            min-width: 44px !important;
            height: 44px !important;
            min-height: 44px !important;
        }

        .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-sc-wizard > .fi-sc-wizard-footer {
            left: auto !important;
            right: 1rem !important;
            gap: .45rem !important;
        }

        .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-modal-footer {
            padding-inline-end: calc(1rem + 44px * 2 + .45rem + .75rem) !important;
        }

        .fi-modal-window.tya-wiz-popup:not(#tya-x) .fi-modal-footer .fi-btn {
            padding-inline: .8rem !important;
        }

        .tya-aktif-pojok:not(#tya-x) {
            right: 1rem !important;
        }

        .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y) {
            width: 44px !important;
            min-width: 44px !important;
            height: 44px !important;
            min-height: 44px !important;
        }
    }

    /* ---------- tema gelap ---------- */
    .dark .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-header,
    .dark .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-footer {
        border-color: rgba(255, 255, 255, .08) !important;
    }

    .dark .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-header > .fi-sc-wizard-header-step:not(:last-child)::after {
        background: rgba(255, 255, 255, .12) !important;
    }

    .dark .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-header > .fi-sc-wizard-header-step.fi-completed:not(:last-child)::after {
        background: #f97316 !important;
    }

    .dark .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-icon-ctn {
        background: #18181b !important;
        border-color: #a1a1aa !important;
    }

    .dark .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step.fi-active .fi-sc-wizard-header-step-icon-ctn,
    .dark .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step.fi-completed .fi-sc-wizard-header-step-icon-ctn {
        background: #f97316 !important;
        border-color: #f97316 !important;
    }

    .dark .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step-label {
        color: #d4d4d8 !important;
    }

    .dark .fi-sc-wizard:not(#tya-x) .fi-sc-wizard-header-step.fi-active .fi-sc-wizard-header-step-label {
        color: #fb923c !important;
    }

    .dark .fi-sc-wizard:not(#tya-x) > .fi-sc-wizard-step.fi-active:not(:has(.fi-section)) {
        background: #1c1c20 !important;
        border-color: rgba(255, 255, 255, .08) !important;
    }

    .dark .tya-wiz-judul > i {
        background: rgba(249, 115, 22, .14);
        box-shadow: none;
    }

    .dark .tya-wiz-judul > i::after {
        background-color: #fb923c;
    }

    .dark .tya-wiz-judul b {
        color: #fafafa;
    }

    .dark .tya-wiz-judul small {
        color: #a1a1aa;
    }

    .dark .fi-sc-wizard:not(#tya-x) .tya-wiz-mundur:not(#tya-y),
    .dark .fi-modal .fi-modal-footer .tya-btn-batal:not(#tya-y) {
        background: transparent !important;
        color: #e4e4e7 !important;
        border-color: rgba(255, 255, 255, .14) !important;
    }
</style>
<script>
    /* WIZARD-PRO-V4: tandai tombol wizard, judul kartu langkah, label Indonesia. */
    (function () {
        if (window.__tyaWizardPro4) return;
        window.__tyaWizardPro4 = true;

        var IKON_LANGKAH = [
            [/outlet|mitra|reseller|toko/, 'store'],
            [/hotspot|wifi|ssid/, 'wifi'],
            [/profil|paket|layanan/, 'tag'],
            [/komisi|persen|bagi hasil/, 'percent'],
            [/catatan|keterangan|pesan/, 'message'],
            [/akun|login|pengguna|user|pemilik/, 'user'],
            [/router|nas|mikrotik|perangkat/, 'router'],
            [/bandwidth|kecepatan|speed/, 'up'],
            [/tagihan|invoice|bayar|pembayaran|harga|biaya/, 'receipt'],
            [/alamat|lokasi|area|wilayah/, 'pin'],
            [/jadwal|waktu|masa/, 'clock'],
            [/keamanan|password|sandi/, 'lock'],
            [/ip|jaringan|network|server/, 'server']
        ];

        // Label tombol berbahasa Inggris yang masih tersisa (mis. label bawaan
        // yang tidak lewat file terjemahan) -> Indonesia. Hanya teks persis.
        var GANTI = {
            'create': 'Simpan',
            'save': 'Simpan',
            'save changes': 'Simpan',
            'submit': 'Simpan',
            'create & create another': 'Simpan & tambah lagi',
            'cancel': 'Batal',
            'next': 'Selanjutnya',
            'back': 'Kembali',
            'previous': 'Kembali'
        };

        function cocok(t) {
            for (var i = 0; i < IKON_LANGKAH.length; i++) {
                if (IKON_LANGKAH[i][0].test(t)) return IKON_LANGKAH[i][1];
            }
            return 'tag';
        }

        function teks(el) {
            return ((el && el.textContent) || '').replace(/\s+/g, ' ').trim();
        }

        function gantiLabel(root) {
            root.querySelectorAll('.fi-btn, .fi-modal-heading, .fi-header-heading, .fi-breadcrumbs li').forEach(function (el) {
                var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
                var n;
                while ((n = walker.nextNode())) {
                    var asli = n.nodeValue;
                    var t = asli.trim();
                    if (!t) continue;
                    var low = t.toLowerCase();
                    var baru = null;
                    if (GANTI.hasOwnProperty(low) && el.matches('.fi-btn, .fi-btn *')) baru = GANTI[low];
                    else if (/^create\s+\S/i.test(t)) baru = t.replace(/^create\b/i, 'Tambah');
                    else if (/^new\s+\S/i.test(t) && el.matches('.fi-btn, .fi-btn *')) baru = t.replace(/^new\b/i, 'Tambah');
                    else if (low === 'create' && el.matches('.fi-breadcrumbs li, .fi-breadcrumbs li *')) baru = 'Tambah';
                    if (baru && baru !== t) n.nodeValue = asli.replace(t, baru);
                }
            });
        }

        function tandaiTombol() {
            document.querySelectorAll('.fi-sc-wizard > .fi-sc-wizard-footer .fi-btn').forEach(function (b) {
                var klik = (b.getAttribute('x-on:click') || '') + ' ' + (b.getAttribute('wire:click') || '');
                var t = teks(b).toLowerCase();
                var mundur = /previous/i.test(klik) || /^(kembali|back|previous|sebelumnya)$/.test(t);
                var maju = /nextstep/i.test(klik) || /^(selanjutnya|berikutnya|next|lanjut)$/.test(t);
                b.classList.toggle('tya-wiz-mundur', mundur && !maju);
                b.classList.toggle('tya-wiz-maju', maju && !mundur);
                if ((mundur || maju) && teks(b)) {
                    b.setAttribute('aria-label', teks(b));
                    b.setAttribute('title', teks(b));
                }
            });
            document.querySelectorAll('.fi-modal .fi-modal-footer .fi-btn').forEach(function (b) {
                var t = teks(b);
                b.classList.toggle('tya-btn-batal', /^(batal|cancel|tutup|close)$/i.test(t));
                b.classList.toggle('tya-btn-simpan2', /^(simpan|save|save changes|create|submit|simpan perubahan)$/i.test(t));
            });

            // popup berisi wizard: tandai & hitung jarak tombol < > dari bawah
            document.querySelectorAll('.fi-modal-window').forEach(function (w) {
                var wz = w.querySelector('.fi-modal-content .fi-sc-wizard');
                var kaki = w.querySelector('.fi-modal-footer');
                var ada = !!(wz && kaki && wz.querySelector(':scope > .fi-sc-wizard-footer'));
                w.classList.toggle('tya-wiz-popup', ada);
                if (!ada) return;
                var tinggiKaki = kaki.getBoundingClientRect().height;
                var nav = wz.querySelector(':scope > .fi-sc-wizard-footer');
                var tinggiNav = nav.getBoundingClientRect().height || 46;
                var bawah = Math.max(6, Math.round((tinggiKaki - tinggiNav) / 2));
                var lama = w.style.getPropertyValue('--tya-kaki');
                if (lama !== bawah + 'px') w.style.setProperty('--tya-kaki', bawah + 'px');
            });
        }

        function nomorLangkah() {
            document.querySelectorAll('.fi-sc-wizard-header-step-number').forEach(function (n) {
                var t = (n.textContent || '').trim();
                if (/^0\d$/.test(t)) n.textContent = t.slice(1);
            });
        }

        function judulLangkah() {
            document.querySelectorAll('.fi-sc-wizard').forEach(function (wz) {
                var aktif = wz.querySelector(':scope > .fi-sc-wizard-header > .fi-sc-wizard-header-step.fi-active');
                var panel = wz.querySelector(':scope > .fi-sc-wizard-step.fi-active');
                if (!panel) return;
                var ada = panel.querySelector(':scope > .tya-wiz-judul');
                if (!aktif || panel.querySelector('.fi-section')) {
                    if (ada) ada.remove();
                    return;
                }
                var label = teks(aktif.querySelector('.fi-sc-wizard-header-step-label'));
                var desk = teks(aktif.querySelector('.fi-sc-wizard-header-step-description'));
                if (!label) return;
                if (ada && ada.getAttribute('data-untuk') === label) return;
                if (ada) ada.remove();
                var el = document.createElement('div');
                el.className = 'tya-wiz-judul';
                el.setAttribute('data-untuk', label);
                el.setAttribute('data-tya-ikon', cocok(label.toLowerCase()));
                el.innerHTML = '<i></i><div><b></b><small></small></div>';
                el.querySelector('b').textContent = label;
                if (desk) el.querySelector('small').textContent = desk;
                else el.querySelector('small').remove();
                panel.insertBefore(el, panel.firstChild);
            });
        }

        // Saklar "Aktif": pindah ke pojok kanan atas kartu (langkah wizard
        // atau section berjudul). Hanya saklar pertama berlabel Aktif.
        function aktifPojok() {
            document.querySelectorAll('.tya-aktif-pojok').forEach(function (f) {
                var k = f.closest('.tya-kartu-aktif');
                if (!k || !document.body.contains(f)) f.classList.remove('tya-aktif-pojok');
            });
            var kartu = [];
            document.querySelectorAll('.fi-sc-wizard > .fi-sc-wizard-step.fi-active:not(:has(.fi-section))').forEach(function (p) {
                if (p.querySelector(':scope > .tya-wiz-judul')) kartu.push([p, '1.35rem']);
            });
            document.querySelectorAll('.fi-section:has(> .fi-section-header)').forEach(function (s) {
                kartu.push([s, '1.3rem']);
            });
            kartu.forEach(function (pasangan) {
                var k = pasangan[0];
                var pilih = null;
                k.querySelectorAll('.fi-fo-field').forEach(function (f) {
                    if (pilih) return;
                    // hanya milik kartu ini (bukan section di dalamnya)
                    var dekat = f.closest('.fi-section, .fi-sc-wizard-step');
                    if (dekat !== k) return;
                    if (!f.querySelector('.fi-toggle, [role="switch"]')) return;
                    var lab = teks(f.querySelector('.fi-fo-field-label-content, .fi-fo-field-label')).toLowerCase();
                    if (/^(aktif|status aktif|active|enabled|aktifkan)\b/.test(lab)) pilih = f;
                });
                k.classList.toggle('tya-kartu-aktif', !!pilih);
                if (!pilih) return;
                k.style.setProperty('--tya-aktif-atas', pasangan[1]);
                pilih.classList.add('tya-aktif-pojok');
                var kol = pilih.closest('.fi-grid-col');
                if (kol && kol.children.length === 1) kol.classList.add('tya-aktif-kolom');
            });
        }

        var dijadwalkan = false;
        var tunda = null;
        function proses() {
            dijadwalkan = false;
            gantiLabel(document);
            tandaiTombol();
            nomorLangkah();
            judulLangkah();
            aktifPojok();
        }

        function jadwalkan() {
            if (dijadwalkan) return;
            dijadwalkan = true;
            clearTimeout(tunda);
            tunda = setTimeout(function () { window.requestAnimationFrame(proses); }, 40);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', jadwalkan);
        } else {
            jadwalkan();
        }
        new MutationObserver(function (m) {
            for (var i = 0; i < m.length; i++) {
                var t = m[i].target;
                if (m[i].type === 'characterData') {
                    // perubahan teks: cuma peduli teks tombol/judul (bukan jam dsb)
                    var p = t.parentElement;
                    if (!p || !p.closest('.fi-btn, .fi-modal-heading, .fi-header-heading, .fi-breadcrumbs, .fi-sc-wizard-header-step-number')) continue;
                    jadwalkan();
                    return;
                }
                if (t && t.closest && t.closest('.tya-wiz-judul')) continue;
                jadwalkan();
                return;
            }
        }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        // ganti langkah wizard cuma mengubah kelas (bukan isi) -- pantau klik
        document.addEventListener('click', function (e) {
            if (e.target && e.target.closest && e.target.closest('.fi-sc-wizard')) {
                setTimeout(jadwalkan, 30);
                setTimeout(jadwalkan, 300);
            }
        }, true);
        document.addEventListener('livewire:navigated', jadwalkan);
    })();
</script>
