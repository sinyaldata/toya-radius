# /etc/freeradius/3.0/mods-available/sql
# Aktifkan dengan: ln -s ../mods-available/sql /etc/freeradius/3.0/mods-enabled/sql
#
# Konfigurasi ini menunjuk FreeRADIUS langsung ke database Laravel "Toya Radius"
# yang sudah punya tabel radcheck, radreply, radgroupcheck, radgroupreply,
# radusergroup, radacct, radpostauth, nas (dibuat via migration Tahap 2).

sql {
    driver = "rlm_sql_mysql"
    dialect = "mysql"

    server = "127.0.0.1"
    port = 3306
    login = "toyaradius_radius"
    password = "GANTI_PASSWORD_INI"
    radius_db = "toyaradius"

    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"
    authcheck_table = "radcheck"
    groupcheck_table = "radgroupcheck"
    authreply_table = "radreply"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"

    # Nama kolom di tabel `nas` mengikuti default FreeRADIUS, jadi tidak perlu
    # override read_clients query — cukup aktifkan:
    read_clients = yes
    client_table = "nas"

    pool {
        start = 5
        min = 4
        max = 10
        spare = 3
        uses = 0
        retry_delay = 30
        lifetime = 0
        idle_timeout = 60
    }
}
