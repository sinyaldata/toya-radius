<style>
    /* =====================================================================
     * DASBOR-MOBILE (2026-10-13) -- tampilan HP (< 768px):
     *  - bar atas: foto + nama pengguna di kiri, tombol keluar (panah) di
     *    kanan; tombol menu, jam server & isi bar atas lainnya disembunyikan
     *  - sidebar disembunyikan; gantinya MENU IKON 5 kolom berisi semua menu
     *    sidebar, di dasbor tepat di bawah kartu "Online Sekarang"
     *  - dasbor: sapaan & jadwal sholat disembunyikan, 4 kartu ringkasan
     *    masing-masing satu baris penuh
     * Elemen dicari lewat skrip (teks/kelas bawaan Filament), jadi tidak
     * perlu mengubah PHP. Layar >= 768px tidak berubah.
     * ===================================================================== */
    #tya-mtop,
    #tya-menu-ikon {
        display: none;
    }

    @media (max-width: 767px) {
        /* ---- bar atas ---- */
        .fi-topbar.tya-mtop-aktif > :not(#tya-mtop) {
            display: none !important;
        }

        .fi-topbar.tya-mtop-aktif {
            padding-inline: 16px !important;
        }

        #tya-mtop {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 56px;
        }

        #tya-mtop .tya-mtop-foto {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            border-radius: 9999px;
            overflow: hidden;
            display: flex;
        }

        #tya-mtop .tya-mtop-foto > * {
            width: 40px !important;
            height: 40px !important;
            max-width: none !important;
            border-radius: 9999px !important;
        }

        #tya-mtop .tya-mtop-teks {
            flex: 1 1 auto;
            min-width: 0;
            line-height: 1.2;
        }

        #tya-mtop .tya-mtop-sapa {
            font-size: 11px;
            color: #71717a;
        }

        #tya-mtop .tya-mtop-nama {
            font-size: 15px;
            font-weight: 700;
            color: #18181b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #tya-mtop .tya-mtop-keluar {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 12px;
            background: #fff7ed;
            cursor: pointer;
        }

        #tya-mtop .tya-mtop-keluar::before {
            content: "";
            width: 22px;
            height: 22px;
            background: #ea580c;
            -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M15.75%209V5.25A2.25%202.25%200%200%200%2013.5%203h-6a2.25%202.25%200%200%200-2.25%202.25v13.5A2.25%202.25%200%200%200%207.5%2021h6a2.25%202.25%200%200%200%202.25-2.25V15M12%209l3%203m0%200-3%203m3-3H2.25%22%20transform%3D%22translate%285%200%29%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
            mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M15.75%209V5.25A2.25%202.25%200%200%200%2013.5%203h-6a2.25%202.25%200%200%200-2.25%202.25v13.5A2.25%202.25%200%200%200%207.5%2021h6a2.25%202.25%200%200%200%202.25-2.25V15M12%209l3%203m0%200-3%203m3-3H2.25%22%20transform%3D%22translate%285%200%29%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat;
        }

        .dark #tya-mtop .tya-mtop-nama {
            color: #fafafa;
        }

        .dark #tya-mtop .tya-mtop-sapa {
            color: #a1a1aa;
        }

        .dark #tya-mtop .tya-mtop-keluar {
            background: rgba(249, 115, 22, 0.14);
        }

        .dark #tya-mtop .tya-mtop-keluar::before {
            background: #fb923c;
        }

        /* ---- sidebar disembunyikan ---- */
        body.tya-mtop-on .fi-sidebar,
        body.tya-mtop-on .fi-sidebar-close-overlay,
        body.tya-mtop-on .fi-topbar-open-sidebar-btn,
        body.tya-mtop-on .fi-topbar-close-sidebar-btn {
            display: none !important;
        }

        /* ---- dasbor ---- */
        .tya-sembunyi-hp {
            display: none !important;
        }

        .tya-statistik {
            display: grid !important;
            grid-template-columns: minmax(0, 1fr) !important;
            gap: 10px !important;
        }

        .tya-statistik > * {
            grid-column: 1 / -1 !important;
            width: 100% !important;
            max-width: none !important;
        }

        /* ---- menu ikon 5 kolom ---- */
        #tya-menu-ikon {
            display: block;
            grid-column: 1 / -1;
            margin: 12px 0;
            padding: 14px 10px 6px;
            background: #ffffff;
            border: 1px solid #ececef;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
        }

        #tya-menu-ikon .tya-menu-judul {
            margin: 0 6px 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #71717a;
        }

        #tya-menu-ikon .tya-menu-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 4px;
        }

        #tya-menu-ikon a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 4px 2px 8px;
            border-radius: 12px;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        #tya-menu-ikon .tya-menu-ikon {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #fff7ed;
            color: #ea580c;
        }

        #tya-menu-ikon .tya-menu-ikon svg {
            width: 22px !important;
            height: 22px !important;
            color: inherit !important;
            margin: 0 !important;
        }

        #tya-menu-ikon .tya-menu-label {
            width: 100%;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.2;
            text-align: center;
            color: #3f3f46;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        #tya-menu-ikon a.tya-aktif .tya-menu-ikon {
            background: #f97316;
            color: #ffffff;
        }

        #tya-menu-ikon a:active .tya-menu-ikon {
            transform: scale(0.94);
        }

        .dark #tya-menu-ikon {
            background: #18181b;
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: none;
        }

        .dark #tya-menu-ikon .tya-menu-judul {
            color: #a1a1aa;
        }

        .dark #tya-menu-ikon .tya-menu-ikon {
            background: rgba(249, 115, 22, 0.13);
            color: #fb923c;
        }

        .dark #tya-menu-ikon a.tya-aktif .tya-menu-ikon {
            background: #f97316;
            color: #ffffff;
        }

        .dark #tya-menu-ikon .tya-menu-label {
            color: #d4d4d8;
        }
    }
</style>
<script>
    /* DASBOR-MOBILE: susun bar atas, menu ikon, dan rapikan dasbor di HP. */
    (function () {
        if (window.__tyaDasborMobile) return;
        window.__tyaDasborMobile = true;

        var mq = window.matchMedia('(max-width: 767px)');
        var dijadwalkan = false;
        var LABEL_KARTU = ['Pendapatan Hari Ini', 'Pendapatan Bulan Ini', 'Invoice Belum Dibayar', 'Online Sekarang'];
        var IKON_BAWAAN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6zm0 9.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25zM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6zm0 9.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25z"/></svg>';

        function teks(el) {
            return (el && el.textContent || '').replace(/\s+/g, ' ').trim();
        }

        /* Elemen terkecil di dalam akar yang teksnya persis / diawali pola. */
        function cariTeks(akar, uji) {
            var hasil = null;
            var semua = akar.querySelectorAll('h1,h2,h3,h4,p,span,div,dt,dd,small,strong');
            for (var i = 0; i < semua.length; i++) {
                var el = semua[i];
                if (el.closest('#tya-menu-ikon, #tya-mtop, .fi-sidebar, .fi-topbar')) continue;
                if (el.children.length > 3) continue;
                if (uji(teks(el))) hasil = el;
            }
            return hasil;
        }

        /* Naik dari el sampai induknya juga memuat salah satu teks "pembatas". */
        function naikSampai(el, pembatas) {
            var cur = el;
            while (cur.parentElement && !cur.parentElement.matches('.fi-main, body')) {
                var t = teks(cur.parentElement);
                if (pembatas.some(function (p) { return p && t.indexOf(p) !== -1 && teks(cur).indexOf(p) === -1; })) return cur;
                cur = cur.parentElement;
            }
            return cur;
        }

        // ---------------- bar atas ----------------
        function namaPengguna() {
            var el = document.querySelector('.fi-user-menu-trigger-text');
            if (el && teks(el)) return teks(el);
            var img = document.querySelector('.fi-user-menu .fi-avatar, .fi-user-menu img, .fi-user-avatar');
            var alt = img ? (img.getAttribute('alt') || '') : '';
            alt = alt.replace(/^(avatar( of| dari| milik)?|foto)\s*/i, '').trim();
            if (alt) return alt;
            var h = document.querySelector('.fi-user-menu .fi-dropdown-header');
            return h ? teks(h) : '';
        }

        function keluar() {
            var form = document.querySelector('form[action*="/logout"]');
            if (form) {
                if (form.requestSubmit) form.requestSubmit(); else form.submit();
                return;
            }
            var token = document.querySelector('meta[name="csrf-token"]');
            var seg = location.pathname.split('/').filter(Boolean)[0] || '';
            var f = document.createElement('form');
            f.method = 'POST';
            f.action = '/' + (seg ? seg + '/' : '') + 'logout';
            if (token) {
                var i = document.createElement('input');
                i.type = 'hidden'; i.name = '_token'; i.value = token.getAttribute('content');
                f.appendChild(i);
            }
            document.body.appendChild(f);
            f.submit();
        }

        function sapaan() {
            var j = new Date().getHours();
            return j < 11 ? 'Selamat pagi' : j < 15 ? 'Selamat siang' : j < 18 ? 'Selamat sore' : 'Selamat malam';
        }

        function barAtas() {
            var topbar = document.querySelector('.fi-topbar');
            if (!topbar) return;
            topbar.classList.add('tya-mtop-aktif');
            document.body.classList.add('tya-mtop-on');

            var bar = document.getElementById('tya-mtop');
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'tya-mtop';
                bar.innerHTML = '<div class="tya-mtop-foto"></div><div class="tya-mtop-teks"><div class="tya-mtop-sapa"></div><div class="tya-mtop-nama"></div></div><button type="button" class="tya-mtop-keluar" aria-label="Keluar" title="Keluar"></button>';
                bar.querySelector('.tya-mtop-keluar').addEventListener('click', function () {
                    if (window.confirm('Keluar dari aplikasi?')) keluar();
                });
            }
            if (bar.parentElement !== topbar) topbar.insertBefore(bar, topbar.firstChild);

            var foto = bar.querySelector('.tya-mtop-foto');
            var avatar = document.querySelector('.fi-user-menu .fi-avatar, .fi-user-menu .fi-user-avatar, .fi-user-menu img');
            if (avatar && !foto.firstChild) foto.appendChild(avatar.cloneNode(true));
            bar.querySelector('.tya-mtop-sapa').textContent = sapaan() + ',';
            bar.querySelector('.tya-mtop-nama').textContent = namaPengguna() || 'Pengguna';
        }

        function lepasBarAtas() {
            var bar = document.getElementById('tya-mtop');
            if (bar) bar.remove();
            document.querySelectorAll('.tya-mtop-aktif').forEach(function (x) { x.classList.remove('tya-mtop-aktif'); });
            document.body.classList.remove('tya-mtop-on');
        }

        // ---------------- menu ikon ----------------
        function daftarMenu() {
            var hasil = [];
            var lihat = {};
            document.querySelectorAll('.fi-sidebar-nav li.fi-sidebar-item').forEach(function (li) {
                var a = li.querySelector(':scope > a.fi-sidebar-item-btn, :scope > .fi-sidebar-item-btn');
                if (!a) return;
                var href = a.getAttribute('href');
                if (!href || lihat[href]) return;
                lihat[href] = true;
                var label = teks(li.querySelector(':scope > a .fi-sidebar-item-label, :scope > .fi-sidebar-item-btn .fi-sidebar-item-label')) || teks(a);
                var ikon = a.querySelector('svg.fi-sidebar-item-icon, svg.fi-icon, svg');
                if (!ikon || a.querySelector('.fi-sidebar-item-grouped-border')) {
                    var grup = li.closest('.fi-sidebar-group');
                    var gi = grup ? grup.querySelector('.fi-sidebar-group-btn svg') : null;
                    if (gi && !gi.closest('.fi-sidebar-group-collapse-btn, .fi-sidebar-group-dropdown-trigger-btn')) ikon = gi;
                    else if (!a.querySelector('svg.fi-sidebar-item-icon')) ikon = null;
                }
                hasil.push({
                    href: href,
                    label: label,
                    ikon: ikon ? ikon.outerHTML : IKON_BAWAAN,
                    aktif: li.classList.contains('fi-active'),
                });
            });
            return hasil;
        }

        function buatMenu(menu) {
            var box = document.getElementById('tya-menu-ikon');
            var kunci = JSON.stringify(menu.map(function (m) { return [m.href, m.label, m.aktif]; }));
            if (box && box.getAttribute('data-kunci') === kunci) return box;
            if (!box) {
                box = document.createElement('div');
                box.id = 'tya-menu-ikon';
            }
            box.setAttribute('data-kunci', kunci);
            var html = '<div class="tya-menu-judul">Menu</div><div class="tya-menu-grid">';
            menu.forEach(function (m) {
                var lbl = m.label.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
                html += '<a href="' + m.href.replace(/"/g, '&quot;') + '" class="' + (m.aktif ? 'tya-aktif' : '') + '"><span class="tya-menu-ikon">' + m.ikon + '</span><span class="tya-menu-label">' + lbl + '</span></a>';
            });
            box.innerHTML = html + '</div>';
            return box;
        }

        // ---------------- dasbor ----------------
        function rapikanDasbor() {
            var main = document.querySelector('.fi-main');
            if (!main) return null;

            var kartu = LABEL_KARTU.map(function (l) {
                return cariTeks(main, function (t) { return t === l; });
            }).filter(Boolean);

            // sapaan & jadwal sholat
            var penanda = cariTeks(main, function (t) { return /^jadwal waktu sholat/i.test(t); })
                || cariTeks(main, function (t) { return /^selamat (pagi|siang|sore|malam)\b/i.test(t); });
            if (penanda) {
                var blokSapa = naikSampai(penanda, LABEL_KARTU.concat(['Grafik', 'GRAFIK']));
                if (blokSapa && !blokSapa.matches('.fi-main') && LABEL_KARTU.every(function (l) { return teks(blokSapa).indexOf(l) === -1; })) {
                    blokSapa.classList.add('tya-sembunyi-hp');
                }
            }

            if (kartu.length < 2) return null;

            // induk bersama terdekat dari label-label kartu
            var induk = kartu[0].parentElement;
            while (induk && !kartu.every(function (k) { return induk.contains(k); })) induk = induk.parentElement;
            if (!induk || induk.matches('.fi-main, body')) return null;
            induk.classList.add('tya-statistik');

            // titik sisip menu: setelah kartu "Online Sekarang" (atau setelah wadah kartu)
            var online = kartu.filter(function (k) { return teks(k) === 'Online Sekarang'; })[0] || kartu[kartu.length - 1];
            var anak = online;
            while (anak.parentElement && anak.parentElement !== induk) anak = anak.parentElement;
            var komponen = induk.closest('[wire\\:id]');
            if (komponen && !komponen.contains(main) && !komponen.matches('.fi-page') && !komponen.querySelector('.fi-page')) {
                // kartu ada di dalam satu widget Livewire: sisipkan setelah widget itu
                return { setelah: komponen };
            }
            return { setelah: anak };
        }

        function proses() {
            dijadwalkan = false;
            if (!mq.matches) {
                lepasBarAtas();
                var m0 = document.getElementById('tya-menu-ikon');
                if (m0) m0.remove();
                document.querySelectorAll('.tya-sembunyi-hp, .tya-statistik').forEach(function (x) { x.classList.remove('tya-sembunyi-hp', 'tya-statistik'); });
                return;
            }

            barAtas();

            var posisi = rapikanDasbor();
            var menu = daftarMenu();
            if (posisi && menu.length) {
                var box = buatMenu(menu);
                if (posisi.setelah.nextElementSibling !== box) posisi.setelah.after(box);
            } else {
                var m1 = document.getElementById('tya-menu-ikon');
                if (m1 && !posisi) m1.remove();
            }
        }

        function jadwalkan() {
            if (dijadwalkan) return;
            dijadwalkan = true;
            window.requestAnimationFrame(proses);
        }

        function mulai() {
            jadwalkan();
            new MutationObserver(function (daftar) {
                for (var i = 0; i < daftar.length; i++) {
                    var t = daftar[i].target;
                    if (t && t.closest && !t.closest('#tya-menu-ikon, #tya-mtop')) { jadwalkan(); return; }
                }
            }).observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
        else mulai();

        if (mq.addEventListener) mq.addEventListener('change', jadwalkan);
        document.addEventListener('livewire:navigated', jadwalkan);
    })();
</script>
