# Tambahkan/uncomment baris berikut di /etc/freeradius/3.0/sites-available/default
# (dan /etc/freeradius/3.0/sites-available/inner-tunnel bila pakai EAP)

authorize {
    ...
    sql          # aktifkan lookup radcheck/radgroupcheck via SQL
    ...
}

accounting {
    ...
    sql          # tulis session ke radacct otomatis saat start/interim/stop
    ...
}

post-auth {
    ...
    sql          # log ke radpostauth setiap kali auth request masuk
    ...
    Post-Auth-Type REJECT {
        sql
    }
}

# Setelah edit, restart service:
#   systemctl restart freeradius
#
# Uji manual dari server FreeRADIUS:
#   radtest <username_voucher> <password_voucher> 127.0.0.1 0 <secret_nas>
#
# Debug mode (jalankan foreground, matikan service dulu):
#   systemctl stop freeradius && freeradius -X
